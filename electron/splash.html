<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>larp</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
  .card { position: fixed; inset: 10px; border-radius: 22px; background: #0f0f0f; box-shadow: 0 0 0 1px #262626, 0 24px 60px rgba(0, 0, 0, 0.45);
    display: grid; place-content: center; justify-items: center; gap: 22px; animation: card-in 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes card-in { from { opacity: 0; transform: scale(0.96); } }
  .mark { width: 76px; height: 76px; overflow: visible; }
  .back { animation: back-in 0.9s 0.15s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .front { animation: front-in 0.9s 0.15s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes back-in { from { transform: translate(9px, -9px); opacity: 0; } }
  @keyframes front-in { from { transform: translate(-9px, 9px); opacity: 0; } }
  .word { font: 650 30px/1 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; letter-spacing: -0.04em; color: #ededed;
    animation: rise 0.6s 0.7s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .status { display: grid; justify-items: center; gap: 10px; animation: rise 0.5s 1s ease-out both; }
  .status span { font: 11.5px/1 'Cascadia Mono', Consolas, monospace; color: #6b6b6b; letter-spacing: 0.02em; }
  .bar { width: 120px; height: 2px; border-radius: 2px; background: #232323; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 35%; background: #ededed; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
  body.out .card { transition: opacity 0.25s ease, transform 0.25s ease; opacity: 0; transform: scale(0.98); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01s !important; animation-delay: 0s !important; } }
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 32 32">
      <path class="back" d="M13 4.5h6v13h10v6H13z" fill="#7A7A7A"/>
      <path class="front" d="M3 7.5h6v14h10v6H3z" fill="#F2F2F2" stroke="#0F0F0F" stroke-width="2" paint-order="stroke"/>
    </svg>
    <div class="word">larp</div>
    <div class="status"><span id="status">starting your workspace</span><div class="bar"><i></i></div></div>
  </div>
<script>
  window.setStatus = (text) => { document.getElementById('status').textContent = text; };
  window.closeSplash = () => { document.body.classList.add('out'); setTimeout(() => { document.title = 'closed'; }, 260); };
  // Keep the branded launch visible for 2.5 seconds before the workbench takes over.
  setTimeout(() => { document.title = 'ready'; }, 2500);
</script>
</body>
</html>
