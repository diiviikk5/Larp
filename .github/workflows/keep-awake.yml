# Keeps the hosted Larp space on Render awake: free web services sleep after 15 idle minutes and then
# take 30-60 s to wake. This asks its health check every 10 minutes. Set the address once as a
# repository variable (Settings > Secrets and variables > Actions > Variables):
#   LARP_HOSTED_URL = https://larp-coordinator.onrender.com
# Without it, the job does nothing. It can also be run by hand (Actions > Keep the hosted space awake).
name: Keep the hosted space awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the space's health check
        env:
          URL: ${{ vars.LARP_HOSTED_URL }}
        run: |
          if [ -z "$URL" ]; then echo "LARP_HOSTED_URL is not set; nothing to ping."; exit 0; fi
          # A sleeping service can take up to a minute to answer the first time.
          curl -fsS --max-time 90 --retry 2 --retry-delay 5 "${URL%/}/api/health" && echo " · awake"
